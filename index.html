<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <style>
    * { margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; cursor: grab; }
    body.dragging { cursor: grabbing; }
    canvas { display: block; }
    #loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #loader div {
      width: 24px; height: 24px;
      border: 2px solid #ccc;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader"><div></div></div>
<script type="module">
  import * as THREE from "https://esm.sh/three@0.160.0"
  import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
  renderer.setPixelRatio(window.devicePixelRatio)
  renderer.setSize(window.innerWidth, window.innerHeight)
  document.body.appendChild(renderer.domElement)

  const scene = new THREE.Scene()
  const camera = new THREE.PerspectiveCamera(15, window.innerWidth / window.innerHeight, 0.1, 200)

  let model
  let modelReady = false

  function fitCameraToModel() {
    if (!model) return
    const box = new THREE.Box3().setFromObject(model)
    const size = box.getSize(new THREE.Vector3())
    const aspect = window.innerWidth / window.innerHeight
    const fovRad = (camera.fov * Math.PI) / 180

    const distH = (size.y / 2) / Math.tan(fovRad / 2)
    const distW = (size.x / 2) / Math.tan(fovRad / 2) / aspect

    camera.position.z = Math.max(distH, distW) * 1.2
    camera.aspect = aspect
    camera.updateProjectionMatrix()
  }

  function updateCamera() {
    renderer.setSize(window.innerWidth, window.innerHeight)
    fitCameraToModel()
  }

  updateCamera()
  window.addEventListener("resize", updateCamera)

  scene.add(new THREE.AmbientLight(0xffffff, 0.1))
  const key = new THREE.DirectionalLight(0xffffff, 8)
  key.position.set(8, 3, 3)
  scene.add(key)
  const fill = new THREE.DirectionalLight(0xffffff, 1.5)
  fill.position.set(-3, -1, 3)
  scene.add(fill)
  const rim = new THREE.DirectionalLight(0xffffff, 2.0)
  rim.position.set(-5, 2, -5)
  scene.add(rim)

  const loader = new GLTFLoader()
  loader.load(
    "./Melius9.glb",
    (gltf) => {
      document.getElementById("loader").style.display = "none"
      model = gltf.scene
      const box = new THREE.Box3().setFromObject(model)
      const center = box.getCenter(new THREE.Vector3())
      model.position.sub(center)
      model.traverse((child) => {
        if (child.isMesh) {
          child.material.roughness = 0.0
          child.material.metalness = 1.0
          child.material.color.set("#101010")
          child.material.envMapIntensity = 2.0
          child.material.needsUpdate = true
        }
      })
      model.rotation.y = 0
      scene.add(model)
      fitCameraToModel()
      modelReady = true
    },
    undefined,
    (error) => {
      console.error("GLB load error:", error)
      document.getElementById("loader").innerHTML =
        "<p style='color:#999;font-size:12px;font-family:sans-serif'>Failed to load model</p>"
    }
  )

  let isDragging = false
  let prevX = 0
  let velocityX = 0

  renderer.domElement.addEventListener("pointerdown", (e) => {
    isDragging = true
    prevX = e.clientX
    velocityX = 0
    document.body.classList.add("dragging")
  })

  window.addEventListener("pointermove", (e) => {
    if (!isDragging || !model) return
    const deltaX = e.clientX - prevX
    velocityX = deltaX * 0.01
    model.rotation.y += velocityX
    prevX = e.clientX
  })

  function stopDrag() {
    isDragging = false
    document.body.classList.remove("dragging")
  }

  window.addEventListener("pointerup", stopDrag)
  window.addEventListener("pointercancel", stopDrag)
  window.addEventListener("pointerleave", stopDrag)

  const animate = () => {
    requestAnimationFrame(animate)
    if (model && modelReady) {
      if (isDragging) {
        // driven by pointermove
      } else {
        if (Math.abs(velocityX) > 0.0001) {
          velocityX *= 0.95
          model.rotation.y += velocityX
        } else {
          velocityX = 0
          const diff = model.rotation.y
          if (Math.abs(diff) > 0.001) {
            model.rotation.y -= diff * 0.033
          } else {
            model.rotation.y = 0
          }
          // model.rotation.y += 0.0012  // RE-ENABLE for auto-spin
        }
      }
    }
    renderer.render(scene, camera)
  }
  animate()
</script>
</body>
</html>
